<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Second Brain mark: a circle in two halves — the filled one is your own mind,
       the outline is the "second brain" that keeps what you give it.
       Full-bleed background so it also works as a maskable icon (the mark stays inside the 80% safe zone). -->
  <rect width="100" height="100" fill="#0b1424"/>
  <path d="M47 22 A28 28 0 0 0 47 78 Z" fill="#60a5fa"/>
  <path d="M55 25.5 A25 25 0 0 1 55 74.5" fill="none" stroke="#60a5fa" stroke-width="7" stroke-linecap="round"/>
  <circle cx="60" cy="50" r="5" fill="#2dd4bf"/>
</svg>
