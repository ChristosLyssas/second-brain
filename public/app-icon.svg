  <circle cx="256" cy="256" r="150" fill="none" stroke="#60a5fa" stroke-width="28" stroke-linecap="round"
          stroke-dasharray="660 942" transform="rotate(-90 256 256)"/>
  <text x="256" y="262" text-anchor="middle" dominant-baseline="middle"
        font-family="Syne, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="120" fill="#f1f5f9">SB</text>
</svg>
